<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // 기본 주소(*.web.app, *.firebaseapp.com)로 들어오면 VITE_SITE_URL 도메인으로 이동.
      // 주소마다 localStorage가 달라 중복 투표가 생기는 것을 막는다. ?from= 등은 그대로 넘긴다.
      (function () {
        try {
          var site = new URL('%VITE_SITE_URL%');
          var host = location.hostname;
          if (host !== site.hostname && /\.(web\.app|firebaseapp\.com)$/.test(host)) {
            location.replace(site.origin + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0e0e10" />
    <title>제 다음 머리 골라주세요</title>
    <meta name="description" content="어떤 머리가 제일 잘 어울릴지 한 표 부탁해요!" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="제 다음 머리 골라주세요 💇" />
    <meta property="og:description" content="면접 앞두고 머리 정리하려고 해요. 어떤 머리가 제일 잘 어울릴지 한 표 부탁해요!" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-2.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>제 다음 머리<br />골라주세요 💇</h1>
        <p class="intent">곧 면접이 있어서, 첫인상을 더 좋게 만들고 싶어 오래 기른 머리를 정리하려고 해요.</p>

        <figure class="current">
          <img src="/images/current.webp" width="320" height="411" alt="현재 머리: 어깨까지 오는 웨이브 장발" />
          <figcaption>
            <span class="badge">현재</span>
            <strong>어깨까지 오는 웨이브 장발</strong>
            <span>이 머리에서 어떻게 바꾸면 좋을까요?</span>
          </figcaption>
        </figure>

        <p>아래 후보 중 제일 잘 어울릴 것 같은 스타일에 한 표 부탁해요. 마음이 바뀌면 다른 걸 눌러도 돼요.</p>
      </header>

      <section aria-labelledby="styles-title">
        <h2 id="styles-title" class="section-title">후보</h2>
        <ol id="styles" class="cards"></ol>
        <p id="vote-status" class="vote-status" hidden>투표 완료! 다른 후보를 누르면 바뀌어요.</p>
      </section>

      <section aria-labelledby="comment-title" class="comment">
        <h2 id="comment-title" class="section-title">한마디 남기기</h2>
        <p class="hint">남긴 의견은 저만 볼 수 있어요.</p>
        <form id="comment-form" novalidate>
          <label for="name">이름</label>
          <input id="name" name="name" type="text" maxlength="20" placeholder="비워두면 익명" autocomplete="nickname" />

          <label for="body">코멘트</label>
          <textarea id="body" name="body" maxlength="500" rows="4" placeholder="이 머리가 좋은 이유, 선택지 외에 추천하는 스타일 등 아무거나 적어주세요!" required></textarea>
          <div class="form-footer">
            <span id="counter" class="counter" aria-live="polite"></span>
            <button id="submit" type="submit">보내기</button>
          </div>
        </form>
      </section>
    </main>

    <dialog id="viewer" class="viewer" aria-label="이미지 크게 보기">
      <img id="viewer-img" alt="" />
      <p id="viewer-caption"></p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
