<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf7f2" />
    <title>제 다음 머리 골라주세요</title>
    <meta name="description" content="어떤 머리가 제일 잘 어울릴지 한 표 부탁해요!" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="제 다음 머리 골라주세요 💇" />
    <meta property="og:description" content="어떤 머리가 제일 잘 어울릴지 한 표 부탁해요!" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>제 다음 머리<br />골라주세요 💇</h1>
        <p>제일 잘 어울릴 것 같은 스타일에 한 표 부탁해요.<br />마음이 바뀌면 다른 걸 눌러도 돼요.</p>
      </header>

      <section aria-labelledby="styles-title">
        <h2 id="styles-title" class="section-title">후보</h2>
        <ol id="styles" class="cards"></ol>
        <p id="vote-status" class="vote-status" hidden>투표 완료! 다른 후보를 누르면 바뀌어요.</p>
      </section>

      <section aria-labelledby="comment-title" class="comment">
        <h2 id="comment-title" class="section-title">한마디 남기기</h2>
        <p class="hint">남긴 의견은 저만 볼 수 있어요.</p>
        <form id="comment-form" novalidate>
          <label for="name">이름</label>
          <input id="name" name="name" type="text" maxlength="20" placeholder="비워두면 익명" autocomplete="nickname" />

          <label for="body">코멘트</label>
          <textarea id="body" name="body" maxlength="500" rows="4" placeholder="이 머리가 좋은 이유, 추천하는 미용실 등 뭐든지요!" required></textarea>
          <div class="form-footer">
            <span id="counter" class="counter" aria-live="polite"></span>
            <button id="submit" type="submit">보내기</button>
          </div>
        </form>
      </section>
    </main>

    <dialog id="viewer" class="viewer" aria-label="이미지 크게 보기">
      <img id="viewer-img" alt="" />
      <p id="viewer-caption"></p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
