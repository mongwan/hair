<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>투표 결과 콘솔</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<style>
  :root {
    --bg: #0e0e10;
    --surface: #1a1a1d;
    --surface-2: #232327;
    --text: #f2f2f3;
    --muted: #a1a1a8;
    --line: #2c2c31;
    --accent: #ff8f5e;
    --accent-text: #17110d;
    --error: #ff6b6b;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    word-break: keep-all;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 24px; }
  h2 { margin: 0 0 4px; font-size: 17px; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; align-items: center; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; }
  .chip .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chip[aria-pressed='true'] .n { color: var(--accent-text); opacity: .75; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .value small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }

  .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
  .card + .card { margin-top: 16px; }
  .grid2 .card + .card { margin-top: 0; }

  /* 가로 막대 그래프 */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(84px, 140px) 1fr; align-items: center; gap: 12px; position: relative; }
  .bar-label { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
  .bar-label img { width: 28px; height: 37px; object-fit: cover; border-radius: 6px; flex: none; }
  .bar-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track {
    position: relative; height: 28px; display: flex; align-items: center;
  }
  .bar-fill {
    height: 20px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px;
    transition: width .35s ease;
  }
  .bar-fill.zero { background: var(--line); }
  .bar-value { margin-left: 8px; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-value .pct { color: var(--muted); margin-left: 4px; }
  .bar-row:hover .bar-fill { filter: brightness(1.12); }
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover .bar-label { text-decoration: underline; }
  .empty { color: var(--muted); padding: 16px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.active td:first-child { color: var(--accent); font-weight: 600; }
  tfoot td { font-weight: 700; border-bottom: 0; }
  td.max { color: var(--accent); font-weight: 700; }
  .table-wrap { overflow-x: auto; }

  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .comments li { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
  .comments .head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .comments .name { color: var(--text); font-weight: 600; font-size: 14px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; }
  .comments .body { white-space: pre-wrap; overflow-wrap: anywhere; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; background: #000; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; opacity: 0; transition: opacity .1s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t { font-weight: 600; margin-bottom: 2px; }
  .tooltip .d { color: var(--muted); }

  .error { border: 1px solid var(--error); color: var(--error); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>투표 결과 콘솔</h1>
    <div class="meta"><span id="meta">불러오는 중…</span><button id="reload" type="button">새로고침</button></div>
  </header>

  <div id="error" class="error" hidden></div>

  <nav class="filters" id="filters" aria-label="출처(source) 필터"></nav>

  <section class="tiles">
    <div class="tile"><div class="label">투표 수</div><div class="value" id="t-votes">–</div></div>
    <div class="tile"><div class="label">의견 수</div><div class="value" id="t-comments">–</div></div>
    <div class="tile"><div class="label">1위</div><div class="value" id="t-top">–</div></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>스타일별 득표</h2>
      <p class="sub" id="style-sub"></p>
      <div class="bars" id="style-bars"></div>
    </section>
    <section class="card">
      <h2>출처별 투표 수</h2>
      <p class="sub">막대를 누르면 해당 출처만 봅니다</p>
      <div class="bars" id="source-bars"></div>
    </section>
  </div>

  <section class="card">
    <h2>출처 × 스타일</h2>
    <p class="sub">행을 누르면 해당 출처로 필터링</p>
    <div class="table-wrap"><table id="matrix"></table></div>
  </section>

  <section class="card">
    <h2>의견 <span id="comment-count" class="sub"></span></h2>
    <p class="sub" id="comment-sub"></p>
    <ul class="comments" id="comments"></ul>
  </section>
</main>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
const ALL = '__all__';
let data = null;
let selected = ALL;

const $ = (id) => document.getElementById(id);
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR', { dateStyle: 'short', timeStyle: 'short' }) : '-');
const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else node.setAttribute(k, v);
  }
  node.append(...children.filter((c) => c != null));
  return node;
}

// ---------- 툴팁 ----------
const tooltip = $('tooltip');
function bindTooltip(node, title, detail) {
  node.addEventListener('mousemove', (e) => {
    tooltip.replaceChildren(el('div', { class: 't' }, title), el('div', { class: 'd' }, detail));
    const x = Math.min(e.clientX + 14, innerWidth - tooltip.offsetWidth - 8);
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${e.clientY + 14}px`;
    tooltip.classList.add('show');
  });
  node.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
}

// ---------- 집계 ----------
function sources() {
  const counts = new Map();
  for (const v of data.votes) counts.set(v.source, (counts.get(v.source) ?? 0) + 1);
  for (const c of data.comments) if (!counts.has(c.source)) counts.set(c.source, 0);
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const inSource = (item) => selected === ALL || item.source === selected;

function styleCounts(votes) {
  const counts = new Map(data.styles.map((s) => [s.id, 0]));
  for (const v of votes) counts.set(v.styleId, (counts.get(v.styleId) ?? 0) + 1);
  return counts;
}

// ---------- 렌더 ----------
function select(source) {
  selected = selected === source ? ALL : source;
  render();
}

function renderFilters() {
  const commentCounts = new Map();
  for (const c of data.comments) commentCounts.set(c.source, (commentCounts.get(c.source) ?? 0) + 1);
  const chip = (value, label, votes, comments) =>
    el('button', { type: 'button', class: 'chip', 'aria-pressed': String(selected === value), onclick: () => { selected = value; render(); } },
      label, el('span', { class: 'n' }, `${votes}표 · ${comments}개`));
  $('filters').replaceChildren(
    chip(ALL, '전체', data.votes.length, data.comments.length),
    ...sources().map(([s, n]) => chip(s, s, n, commentCounts.get(s) ?? 0)),
  );
}

function barRow({ label, image, value, total, max, detail, onclick }) {
  const width = max ? (value / max) * 100 : 0;
  const row = el('div', { class: `bar-row${onclick ? ' clickable' : ''}`, ...(onclick ? { onclick, role: 'button', tabindex: '0' } : {}) },
    el('div', { class: 'bar-label' }, image ? el('img', { src: image, alt: '' }) : null, el('span', {}, label)),
    el('div', { class: 'bar-track' },
      el('div', { class: `bar-fill${value ? '' : ' zero'}`, style: `width: calc((100% - 56px) * ${width / 100})` }),
      el('span', { class: 'bar-value' }, String(value), el('span', { class: 'pct' }, `${pct(value, total)}%`)),
    ),
  );
  if (onclick) row.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onclick(); } });
  bindTooltip(row, label, detail ?? `${value}표 · ${pct(value, total)}%`);
  return row;
}

function render() {
  const votes = data.votes.filter(inSource);
  const comments = data.comments.filter(inSource);
  const counts = styleCounts(votes);
  const max = Math.max(0, ...counts.values());
  const label = selected === ALL ? '전체 출처' : `from=${selected}`;

  renderFilters();

  // 요약
  $('t-votes').textContent = votes.length;
  $('t-comments').textContent = comments.length;
  const top = data.styles.filter((s) => max > 0 && counts.get(s.id) === max);
  $('t-top').replaceChildren(top.length ? top.map((s) => s.name).join(', ') : '–', top.length ? el('small', {}, `${max}표`) : '');

  // 스타일별 막대
  $('style-sub').textContent = `${label} · 총 ${votes.length}표`;
  $('style-bars').replaceChildren(
    ...data.styles.map((s) => barRow({ label: s.name, image: s.image, value: counts.get(s.id), total: votes.length, max })),
  );
  const unknown = votes.filter((v) => !data.styles.some((s) => s.id === v.styleId)).length;
  if (unknown) $('style-bars').append(el('p', { class: 'sub' }, `현재 후보 목록에 없는 styleId 투표 ${unknown}표`));

  // 출처별 막대
  const srcList = sources().filter(([, n]) => n > 0);
  const srcMax = Math.max(0, ...srcList.map(([, n]) => n));
  $('source-bars').replaceChildren(
    ...(srcList.length
      ? srcList.map(([s, n]) => {
          const row = barRow({ label: s, value: n, total: data.votes.length, max: srcMax, onclick: () => select(s) });
          if (selected !== ALL && selected !== s) row.style.opacity = '.45';
          return row;
        })
      : [el('div', { class: 'empty' }, '아직 투표가 없어요')]),
  );

  // 출처 × 스타일 표
  const allSources = sources();
  const head = el('tr', {}, el('th', {}, '출처'), ...data.styles.map((s) => el('th', {}, s.name)), el('th', {}, '합계'), el('th', {}, '의견'));
  const body = allSources.map(([s]) => {
    const c = styleCounts(data.votes.filter((v) => v.source === s));
    const rowMax = Math.max(0, ...c.values());
    const total = data.votes.filter((v) => v.source === s).length;
    return el('tr', { class: selected === s ? 'active' : '', onclick: () => select(s) },
      el('td', {}, s),
      ...data.styles.map((st) => el('td', { class: rowMax && c.get(st.id) === rowMax ? 'max' : '' }, String(c.get(st.id)))),
      el('td', {}, String(total)),
      el('td', {}, String(data.comments.filter((x) => x.source === s).length)),
    );
  });
  const totals = styleCounts(data.votes);
  const foot = el('tr', {}, el('td', {}, '합계'), ...data.styles.map((s) => el('td', {}, String(totals.get(s.id)))),
    el('td', {}, String(data.votes.length)), el('td', {}, String(data.comments.length)));
  $('matrix').replaceChildren(el('thead', {}, head), el('tbody', {}, ...body), el('tfoot', {}, foot));

  // 의견
  $('comment-count').textContent = `(${comments.length})`;
  $('comment-sub').textContent = `${label} · 최신순`;
  $('comments').replaceChildren(
    ...(comments.length
      ? comments.map((c) => el('li', {},
          el('div', { class: 'head' }, el('span', { class: 'name' }, c.name), el('span', { class: 'tag' }, c.source), el('span', {}, fmtDate(c.createdAt))),
          el('div', { class: 'body' }, c.body)))
      : [el('li', { class: 'empty' }, '의견이 없어요')]),
  );
}

async function load() {
  $('reload').disabled = true;
  $('meta').textContent = '불러오는 중…';
  try {
    const res = await fetch('/api/results');
    if (!res.ok) throw new Error(await res.text());
    data = await res.json();
    if (selected !== ALL && !sources().some(([s]) => s === selected)) selected = ALL;
    $('error').hidden = true;
    $('meta').textContent = `${data.emulator ? '에뮬레이터' : data.projectId} · ${fmtDate(data.fetchedAt)} 기준`;
    render();
  } catch (error) {
    $('error').hidden = false;
    $('error').textContent = `데이터를 불러오지 못했어요.\n${error.message}\n\nREADME의 "결과 확인 (로컬 관리자 콘솔)" 인증 설정을 확인하세요.`;
    $('meta').textContent = '오류';
  } finally {
    $('reload').disabled = false;
  }
}

$('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
